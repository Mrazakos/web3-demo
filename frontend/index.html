<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleStorage dApp</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <h1>SimpleStorage</h1>
          <p class="subtitle">Hardhat Localhost (Chain ID 31337)</p>
        </div>
        <button id="connectBtn" class="btn">Connect Wallet</button>
      </header>

      <!-- Network Warning -->
      <div id="networkWarning" class="alert hidden">
        <span>Wrong network. Switch to Hardhat Localhost (31337).</span>
        <button id="switchNetworkBtn" class="btn btn-sm">Switch Network</button>
      </div>

      <!-- Box 1: Stored Value -->
      <section class="box">
        <div class="box-header">
          <span class="box-title">Stored Value</span>
          <button id="refreshBtn" class="btn-text" type="button">Refresh</button>
        </div>
        <div id="storedValueDisplay" class="stored-value">--</div>
      </section>

      <!-- Box 2: Update Value -->
      <section class="box">
        <span class="box-title">Update Value</span>
        <form id="updateForm" class="form-row">
          <input
            type="text"
            id="newValueInput"
            placeholder="Enter new value..."
            autocomplete="off"
            required
          />
          <button type="submit" id="submitBtn" class="btn btn-primary" disabled>
            Save
          </button>
        </form>
        <div id="statusMessage" class="status hidden"></div>
      </section>

      <!-- Box 3: Connection Details -->
      <section class="box box-details">
        <div class="detail-row">
          <span class="detail-label">Contract</span>
          <code id="contractAddressDisplay" class="detail-value">Loading...</code>
        </div>
        <div class="detail-row">
          <span class="detail-label">Wallet</span>
          <code id="walletAddressDisplay" class="detail-value">Not Connected</code>
        </div>
        <div class="detail-row">
          <span class="detail-label">Balance</span>
          <span id="walletBalanceDisplay" class="detail-value">--</span>
        </div>
      </section>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
